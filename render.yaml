services:
  - type: web
    name: careertrack-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health/database
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_ECHO
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "60"
      - key: JWT_ISSUER
        value: careertrack-api
      - key: JWT_AUDIENCE
        value: careertrack-web
      - key: AUTH_COOKIE_NAME
        value: careertrack_session
      - key: CSRF_COOKIE_NAME
        value: careertrack_csrf
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: FORCE_HTTPS
        value: "true"
      - key: MAX_REQUEST_BYTES
        value: "11534336"
      - key: RESUME_STORAGE_BACKEND
        value: s3
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "120"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
