services:
  db:
    image: postgres:16
    container_name: careertrack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: careertrack
      POSTGRES_USER: careertrack
      POSTGRES_PASSWORD: careertrack_dev

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careertrack -d careertrack"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
