services:
  db:
    image: postgres:16
    container_name: careertrack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: careertrack
      POSTGRES_USER: careertrack
      POSTGRES_PASSWORD: careertrack_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: